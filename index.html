<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Double J Menu - Your digital menu solution">
    <meta name="theme-color" content="#317EFB">
    
    <title>Double J Menu</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512x512.png">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Double J Menu</h1>
            <nav>
                <button id="installBtn" class="install-button" style="display: none;">Install App</button>
            </nav>
        </header>
        
        <main>
            <section class="hero">
                <h2>Welcome to Double J Menu</h2>
                <p>🩵 a product of love 🩵</p>
            </section>
            
            <!-- Add Item Form -->
            <section class="add-item-section">
                <button id="toggleFormBtn" class="toggle-form-btn">+ Add New Item</button>
                
                <form id="addItemForm" class="add-item-form" style="display: none;">
                    <h3>Add Menu Item</h3>
                    <div class="form-group">
                        <label for="itemName">Item Name *</label>
                        <input type="text" id="itemName" required placeholder="e.g., Caesar Salad">
                    </div>
                    <div class="form-group">
                        <label for="itemDescription">Description</label>
                        <textarea id="itemDescription" rows="3" placeholder="Brief description of the item"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="itemTag">Tag/Category *</label>
                        <input type="text" id="itemTag" required placeholder="e.g., Appetizer, Main Course, Dessert" list="tagSuggestions">
                        <datalist id="tagSuggestions">
                            <!-- Previously used tags will be populated here -->
                        </datalist>
                        <div id="existingTags" class="existing-tags"></div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-submit">Add Item</button>
                        <button type="button" id="cancelBtn" class="btn-cancel">Cancel</button>
                    </div>
                </form>
            </section>
            
            <section class="menu-container">
                <div id="menuItems">
                    <!-- Menu items will be loaded here -->
                </div>
            </section>
        </main>
        
        <footer>
            <p>&copy; 2026 Double J Menu. All rights reserved.</p>
        </footer>
    </div>
    
    <!-- Scripts -->
    <script>
    // Temporary: Force unregister old service worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for(let registration of registrations) {
                registration.unregister();
                console.log('Service worker unregistered');
            }
        });
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/install.js"></script>
</body>
</html>
