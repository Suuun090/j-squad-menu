<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Double J Menu - Your digital menu solution">
    <meta name="theme-color" content="#89CFF0">
    
    <title>Double J Menu</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="icons/iTunesArtwork@1x.png">
    <link rel="apple-touch-icon" href="icons/iTunesArtwork@1x.png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tags.css">
</head>
<body>
    <div id="app">
        <header>
            <div class="header-left">
                <button id="hamburgerBtn" class="hamburger-btn" aria-label="Open navigation">
                    <span></span><span></span><span></span>
                </button>
                <div id="navDropdown" class="nav-dropdown">
                    <a href="#menu" class="nav-link" onclick="navigateTo('menu'); return false;">Menu</a>
                    <a href="#tags" class="nav-link" onclick="navigateTo('tags'); return false;">Tags</a>
                    <a href="#order" class="nav-link" onclick="navigateTo('order'); return false;">Order</a>
                </div>
            </div>
            <h1>Double J Menu</h1>
            <nav>
                <span id="orderNumberBadge" class="order-number-badge" style="display: none;"></span>
                <button id="installBtn" class="install-button" style="display: none;">Install App</button>
            </nav>
        </header>
        
        <main>
            <!-- Menu page -->
            <div id="page-menu" class="page">
                <section class="hero">
                    <h2>Welcome to Double J Menu</h2>
                    <p>🩵 a product of love 🩵</p>
                </section>

                <section class="add-item-section">
                    <button id="toggleFormBtn" class="toggle-form-btn">+ Add New Item</button>

                    <form id="addItemForm" class="add-item-form" style="display: none;">
                        <h3 id="formTitle">Add Menu Item</h3>
                        <input type="hidden" id="editingItemId" value="">
                        <div class="form-group">
                            <label for="itemName">Item Name *</label>
                            <input type="text" id="itemName" required placeholder="e.g., Caesar Salad">
                        </div>
                        <div class="form-group">
                            <label for="itemDescription">Description</label>
                            <textarea id="itemDescription" rows="3" placeholder="Brief description of the item"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="itemTag">Tags/Categories *</label>
                            <div class="tag-input-container">
                                <input type="text" id="itemTag" placeholder="e.g., Appetizer, Main Course" list="tagSuggestions">
                                <button type="button" id="addTagBtn" class="add-tag-btn">+ Add Tag</button>
                            </div>
                            <datalist id="tagSuggestions">
                                <!-- Previously used tags will be populated here -->
                            </datalist>
                            <div id="selectedTags" class="selected-tags"></div>
                            <div id="existingTags" class="existing-tags"></div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn-submit" id="submitBtn">Add Item</button>
                            <button type="button" id="cancelBtn" class="btn-cancel">Cancel</button>
                        </div>
                    </form>
                </section>

                <div id="menuItems" class="menu-container">
                    <!-- Menu items will be loaded here -->
                </div>
            </div>

            <!-- Order page -->
            <div id="page-order" class="page" style="display: none;">

                <!-- Landing: create or join -->
                <div id="orderLanding">
                    <div class="order-landing-card">
                        <h2 class="order-landing-title">Place an Order</h2>

                        <div class="form-group">
                            <label for="orderPersonName">Your Name</label>
                            <input type="text" id="orderPersonName" placeholder="Enter your name" autocomplete="name">
                        </div>

                        <button class="toggle-form-btn" onclick="createOrder()">Start New Order</button>

                        <div class="order-divider"><span>or join an existing order</span></div>

                        <div class="order-join-row">
                            <input type="text" id="joinOrderInput" placeholder="Order number (e.g. JJ-4821)"
                                autocomplete="off" autocorrect="off" autocapitalize="characters"
                                onkeydown="if(event.key==='Enter') joinOrder()">
                            <button class="btn-join" onclick="joinOrder()">Join</button>
                        </div>
                    </div>
                </div>

                <!-- Active order -->
                <div id="orderActive" style="display: none;">
                    <div id="orderTagFilter" class="order-tag-filter"></div>
                    <div id="orderItemsList" class="order-items-list"></div>
                    <div class="order-footer">
                        <button class="finish-order-btn" onclick="showOrderSummary()">Finish Order</button>
                        <button class="leave-order-btn" onclick="leaveOrder()">Leave Order</button>
                    </div>
                </div>

                <!-- Summary -->
                <div id="orderSummary" style="display: none;">
                    <h2 class="order-summary-title">Order Summary</h2>
                    <div id="orderSummaryContent" class="order-summary-content"></div>
                    <div class="order-summary-actions">
                        <a id="emailOrderBtn" class="btn-submit order-email-btn" href="#">Send via Email</a>
                        <button class="btn-cancel" onclick="backToActiveOrder()">Back to Order</button>
                    </div>
                </div>
            </div>

            <!-- Tags page -->
            <div id="page-tags" class="page" style="display: none;">
                <!-- Tags list view -->
                <div id="tagsListView">
                    <div id="tagsPanel" class="tags-panel">
                        <!-- Tags will be loaded here -->
                    </div>
                </div>
                <!-- Tag items view -->
                <div id="tagItemsView" style="display: none;">
                    <button class="back-btn" onclick="showTagsList()">&#8592; Back to Tags</button>
                    <h2 id="tagItemsTitle" class="tag-items-heading"></h2>
                    <div id="tagItemsList" class="tag-items-list"></div>
                </div>
            </div>
        </main>
        
        <footer>
            <p>&copy; 2026 Double J Menu. All rights reserved.</p>
        </footer>
    </div>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/order.js"></script>
    <script src="js/install.js"></script>
</body>
</html>
