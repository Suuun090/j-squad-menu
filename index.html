<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Double J Menu - Your digital menu solution">
    <meta name="theme-color" content="#317EFB">
    
    <title>Double J Menu</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Double J Menu</h1>
            <nav>
                <button id="installBtn" class="install-button" style="display: none;">Install App</button>
            </nav>
        </header>
        
        <main>
            <section class="hero">
                <h2>Welcome to Double J Menu</h2>
                <p>Your digital menu solution</p>
            </section>
            
            <section class="menu-container">
                <div id="menuItems">
                    <!-- Menu items will be loaded here -->
                </div>
            </section>
        </main>
        
        <footer>
            <p>&copy; 2026 Double J Menu. All rights reserved.</p>
        </footer>
    </div>
    
    <!-- Scripts -->
    <script src="/js/app.js"></script>
    <script src="/js/install.js"></script>
</body>
</html>
